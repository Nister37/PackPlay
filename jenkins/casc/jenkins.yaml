jenkins:
  systemMessage: "PackPlay Jenkins - configuration managed as code"
  numExecutors: 1
  mode: NORMAL
  scmCheckoutRetryCount: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  crumbIssuer:
    standard: {}
  globalNodeProperties:
    - envVars:
        env:
          - key: "NODE_OPTIONS"
            value: "--max-old-space-size=2048"

unclassified:
  location:
    url: "${JENKINS_URL}"
    adminAddress: "${JENKINS_ADMIN_EMAIL}"
